class CustomRoomManager {
    async join(roomName) {
        return new Promise((resolve, reject) => {
            if (typeof Peer === 'undefined') {
                reject(new Error('PeerJS failed to load. Check your internet connection.'));
                return;
            }

            const hostId = 'apexrun-' + roomName;
            let peer = null;
            let conn = null;
            let connections = new Map();
            let presences = new Map();
            let myId = '';
            let peersCallback = null;
            let isHost = false;
            let timeout = setTimeout(() => {
                if (peer) peer.destroy();
                reject(new Error('Connection timeout'));
            }, 8000);

            const updatePeersAndNotify = () => {
                if (peersCallback) {
                    try { peersCallback(); } catch(e){}
                }
            };

            const peerOpts = { host: '0.peerjs.com', port: 443, secure: true, debug: 0 };
            const testPeer = new Peer(hostId, peerOpts);

            testPeer.on('open', (id) => {
                clearTimeout(timeout);
                isHost = true;
                myId = id;
                peer = testPeer;
                presences.set(myId, { n: S.name, car: S.car, rdy: 0, lb: 0 });

                peer.on('connection', (c) => {
                    connections.set(c.peer, c);
                    c.on('data', (data) => {
                        if (data.type === 'presence') {
                            presences.set(c.peer, data.presence);
                            broadcastState();
                            updatePeersAndNotify();
                        }
                    });
                    c.on('close', () => {
                        connections.delete(c.peer);
                        presences.delete(c.peer);
                        broadcastState();
                        updatePeersAndNotify();
                    });
                });
                resolve(roomAPI);
            });

            testPeer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    testPeer.destroy();
                    const clientPeer = new Peer(peerOpts);
                    clientPeer.on('open', (id) => {
                        clearTimeout(timeout);
                        myId = id;
                        peer = clientPeer;
                        const c = clientPeer.connect(hostId, { reliable: true });
                        conn = c;

                        c.on('open', () => {
                            isHost = false;
                            resolve(roomAPI);
                        });

                        c.on('data', (data) => {
                            if (data.type === 'state') {
                                presences = new Map(Object.entries(data.presences));
                                updatePeersAndNotify();
                            }
                        });

                        c.on('close', () => {
                            presences.clear();
                            updatePeersAndNotify();
                        });
                    });
                    clientPeer.on('error', (e) => {
                        clearTimeout(timeout);
                        reject(e);
                    });
                } else {
                    clearTimeout(timeout);
                    reject(err);
                }
            });

            function broadcastState() {
                if (!isHost) return;
                const obj = {};
                presences.forEach((v, k) => { obj[k] = v; });
                const packet = { type: 'state', presences: obj };
                connections.forEach(c => {
                    if (c.open) c.send(packet);
                });
            }

            const roomAPI = {
                peers() {
                    const list = [];
                    presences.forEach((p, id) => {
                        list.push({
                            peer: id,
                            isMe: id === myId,
                            presence: p || {}
                        });
                    });
                    return list;
                },
                presence(p) {
                    presences.set(myId, p);
                    if (isHost) {
                        broadcastState();
                        updatePeersAndNotify();
                    } else {
                        if (conn && conn.open) {
                            conn.send({ type: 'presence', presence: p });
                        }
                    }
                    return Promise.resolve();
                },
                onPeers(cb) {
                    peersCallback = cb;
                },
                leave() {
                    if (peer) {
                        peer.destroy();
                        peer = null;
                    }
                    presences.clear();
                    connections.clear();
                    return Promise.resolve();
                }
            };
        });
    }
}

 show(`<h2>Lobby</h2><p>Code <b style="color:var(--ac);font-size:30px" id="lc"></b></p><p>Share the code with friends to join.</p><div id="pl"></div><div class="row"><button class="p" id="rd"></button><button id="lv">Leave</button></div><p>The race starts when everyone is ready.${ps.length<2?' Racing alone adds 3 bots.':''}</p>`);
 $('#lc').textContent=code==='open'?'open lobby':code;
 ps.forEach(p=>{const d=document.createElement('div');const on=p.isMe?ready===1:p.presence.rdy===1;d.textContent=String(p.presence.n||'Driver').slice(0,14)+(p.isMe?' (you): ':': ')+(!p.isMe&&p.presence.lb!==1?'racing':on?'ready':'waiting');$('#pl').appendChild(d)});
 $('#rd').textContent=ready?'Not ready':'Ready';$('#rd').onclick=()=>{ready=1-ready;push();drawLobby()};$('#lv').onclick=menu}
function toLobby(){ready=0;ph='lobby';setModel();push();drawLobby()}
function finish(){const rf=Object.values(rem).filter(c=>c.fin).length,rank=me.fin+rf,hum=Object.keys(rem).length+1,pz=[3000,2000,1200,700,400,300][Math.min(rank-1,5)]+300*(hum-1);const fix=Math.round(me.dm*2500);S.m=Math.max(0,S.m+pz-fix);save();ph='done';
 setTimeout(()=>{if(ph!=='done')return;show(`<h2>${['1st','2nd','3rd'][rank-1]||rank+'th'} place</h2><p>Prize <b>$${pz}</b>${fix?`, repairs <b>-$${fix}</b>`:''}. Balance <b>$${S.m}</b>.</p><div class="row"><button class="p" id="a1">Race again</button><button id="a2">Garage</button><button id="a3">Menu</button></div>`);
  $('#a1').onclick=()=>rn?toLobby():go();$('#a2').onclick=()=>{leave();garage()};$('#a3').onclick=menu},1500)}
setInterval(()=>{if(ph==='lobby'&&rn){const ps=rn.peers();if(ready&&ps.every(p=>p.isMe||(p.presence.lb===1&&p.presence.rdy===1))){const ids=ps.map(p=>p.peer).sort(),mine=ps.find(p=>p.isMe),slot=mine?ids.indexOf(mine.peer):0;audio();beginRace(slot,ps.length<2?3:0)}}},300);
setInterval(()=>{if(!rn||!/grid|race|done/.test(ph))return;const e=Date.now()-t0<2500;rn.presence({n:S.name,car:S.car,x:+me.x.toFixed(1),z:+me.z.toFixed(1),h:+me.h.toFixed(2),v:+me.v.toFixed(1),pr:+me.pr.toFixed(1),fin:me.fin?1:0,dm:+me.dm.toFixed(2),rdy:e?1:0,lb:e?1:0}).catch(()=>{})},100);

/* input */
addEventListener('keydown',e=>{K[e.key.length>1?e.key:e.key.toLowerCase()]=1;if(/grid|race/.test(ph)&&(e.key.startsWith('Arrow')||e.key===' '))e.preventDefault();if(e.key==='Escape'&&/grid|race|done/.test(ph))menu()});
addEventListener('keyup',e=>{K[e.key.length>1?e.key:e.key.toLowerCase()]=0});
document.querySelectorAll('#tc button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{K[k]=1;e.preventDefault()};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{K[k]=0}});

setModel();menu();
let last=performance.now();(function f(n){requestAnimationFrame(f);const dt=Math.min(.05,(n-last)/1000);last=n;step(dt);render(dt,n)})(last);
</script></body></html>
